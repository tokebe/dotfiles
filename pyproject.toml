[project]
name = "eclectic_dots"
version = "0.0.1a"
description = "A dotfile manager"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "distro>=1.9.0",
  "inquirerpy>=0.3.4",
  "pydantic>=2.13.5",
  "rich>=15.0.0",
  "tomlkit>=0.15.1",
  "typer>=0.27.2",
]

[dependency-groups]
dev = [
  "beautysh>=6.4.3",
  "bpython>=0.26",
  "deptry>=0.25.1",
  "google-yamlfmt>=0.21.0",
  "pyrefly>=1.3.1",
  "ruff>=0.16.8",
  "shellcheck-py>=0.11.0.1",
  "taplo>=0.9.3",
  "taskipy>=1.14.1",
  "yamllint>=1.38.0",
]

[tool.uv]
package = true
compile-bytecode = true

# Only `dot` is a package
[tool.setuptools.packages.find]
include = ["dot*"]
namespaces = true

[project.scripts]
dots = "dot.main:main"

[tool.taskipy.tasks]
# Code work
lint = 'ruff check dot'
'lint:stats' = 'task lint --statistics'
'lint:watch' = 'task lint --watch'
'lint:fix' = 'task lint --fix'

typecheck = 'pyrefly check dot'
'typecheck:watch' = 'task typecheck --watch'

format = 'ruff format --diff dot'
'format:fix' = 'ruff format .'

fixup = """
echo 'Linting...' &&
task lint:fix &&
task shellcheck &&
echo 'Formatting...' &&
task format:fix &&
task tomlfmt &&
task yamlfmt &&
task beautysh &&
echo 'Static analysis...' &&
task typecheck &&
task shellharden &&
echo 'Check dependencies...' &&
deptry . &&
echo "✅ All set!"
"""
# Config work
yamllint = 'yamllint .'
yamlfmt = 'yamlfmt --exclude .venv .'
tomlfmt = 'taplo format'

# Shell work (scripts are extensionless, discovered by shebang)
shellcheck = 'files=$(grep -rlE "^#!.*(bash|/sh)" scripts profiles 2>/dev/null); [ -z "$files" ] || shellcheck $files'
beautysh = 'files=$(grep -rlE "^#!.*(bash|/sh)" scripts profiles 2>/dev/null); [ -z "$files" ] || beautysh --indent-size 2 $files'
shellharden = 'command -v shellharden >/dev/null || { echo "shellharden not installed (cargo install shellharden), skipping"; exit 0; }; files=$(grep -rlE "^#!.*(bash|/sh)" scripts profiles 2>/dev/null); [ -z "$files" ] || shellharden --replace $files'

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # All of these were carefully chosen, see https://docs.astral.sh/ruff/rules
  # Pyflakes
  'F',
  # Pycodestyle errors, warning
  'E4',
  'E7',
  'E9',
  'W',
  # isort (sort imports)
  'I',
  # Pydocstyle (document your code!)
  'D',
  # Pep8 naming conventions (but slightly less pedantic)
  'N80',
  # Pyupgrade (use newer conventions)
  'UP',
  # Flake8-bugbear
  'B',
  # Flake8-annotations (require type annotations)
  'ANN0',
  'ANN2',
  # Flake8-builtins (don't overwrite builtins)
  'A',
  # Flake8-comprehensions
  'C4',
  # Flake8-logging-format
  'G',
  # Flake8-simplify
  'SIM',
  # Flake8-use-pathlib (pathlib is just better)
  'PTH',
  # Pylint
  'PL',
  # Perflint
  'PERF',
  # Refurb
  'FURB',
  # Ruff-specific
  'RUF',
]
ignore = ['D100', 'D206', 'D300']

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.format]
docstring-code-format = true

[tool.deptry]
extend_exclude = ["linked", "misc"]
