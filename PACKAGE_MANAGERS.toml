[brew]
native_on = ["macos", "*"]
refresh = "brew update"
detect = "command -v brew"
install = "scripts/pkg_adapters/brew-install {packages}"
upgrade = "brew upgrade --yes"
check = "brew outdated --quiet 2>&1 | tee /dev/stderr | grep -c . || true"
list_installed = "brew list -1"

[gh-ext]
detect = "command -v gh"
install = "scripts/pkg_adapters/gh-ext-install {packages}"
upgrade = "gh extension upgrade --all"
check = "scripts/pkg_adapters/gh-ext-check"

[uv]
detect = "command -v uv"
install = "scripts/pkg_adapters/uv-tool-install {packages}"
upgrade = "uv tool upgrade --all"
check = "uv tool list --outdated 2>&1 | tee /dev/stderr | grep -c latest: || true"
list_installed = "uv tool list | awk '/^[^ -]/{print $1}'"

[cargo]
detect = "command -v cargo"
install = "scripts/pkg_adapters/cargo-install {packages}"
upgrade = "cargo install-update -a"
check = "scripts/pkg_adapters/cargo-check"
list_installed = "cargo install --list | grep -E '^\\S' | sed 's/ .*//'"


# pnpm queries the registry live, so no refresh; update -g --latest bumps every global to latest.
[pnpm]
detect = "command -v pnpm"
install = "scripts/pkg_adapters/pnpm-install {packages}"
upgrade = "pnpm update -g --latest"
check = "pnpm outdated -g --format list | tee /dev/stderr | grep -c ' => ' || true"
list_installed = "pnpm ls -g --depth=0 --parseable | tail -n +2 | sed 's#.*/node_modules/##'"

[flatpak]
detect = "command -v flatpak"
install = "scripts/pkg_adapters/flatpak-install {packages}"
upgrade = "flatpak update -y"
check = "flatpak remote-ls --updates 2>&1 | tee /dev/stderr | grep -c . || true"
list_installed = "flatpak list --app --columns=application"

[gearlever]
detect = "flatpak info it.mijorus.gearlever"
refresh = "flatpak run it.mijorus.gearlever --fetch-updates"
install = "scripts/pkg_adapters/gearlever-install {packages}"
upgrade = "scripts/pkg_adapters/gearlever-upgrade"
check = "scripts/pkg_adapters/gearlever-check"

# go install @latest always fetches the newest, so there's nothing to upgrade/check after.
[go]
detect = "command -v go"
install = "go install {packages}"
upgrade = "true"
check = "echo 0"

[dnf]
native_on = ["fedora", "rhel", "centos"]
detect = "command -v dnf"
install = "scripts/pkg_adapters/dnf-install {packages}"
upgrade = "sudo dnf upgrade -y"
check = "scripts/pkg_adapters/dnf-check"

[apt]
native_on = ["ubuntu", "debian"]
refresh = "sudo apt-get update"
detect = "command -v apt-get"
install = "scripts/pkg_adapters/apt-install {packages}"
upgrade = "sudo apt-get upgrade -y"
check = "apt-get -s upgrade 2>/dev/null | grep -E '^Inst ' | tee /dev/stderr | grep -c . || true"
